<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2b"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#22304a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- topographic contours, faint -->
  <g fill="none" stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="2">
    <path d="M-20 470 C 200 400, 420 460, 620 410 S 1000 320, 1240 400"/>
    <path d="M-20 540 C 200 470, 430 520, 640 470 S 1010 380, 1240 460"/>
  </g>

  <!-- mark -->
  <g transform="translate(96,96)">
    <rect width="120" height="120" rx="28" fill="url(#mark)"/>
    <g clip-path="none"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="3" stroke-linecap="round" transform="scale(1.875)">
      <path d="M6 47 C 17 41, 27 45, 34 41 S 50 34, 60 39"/>
      <path d="M4 55 C 16 50, 27 53, 35 49 S 52 43, 62 47"/>
    </g>
    <g stroke="#ffffff" stroke-width="5.6" stroke-linecap="round" fill="none" transform="scale(1.875)">
      <path d="M32 32 L20 20 M32 32 L44 20 M32 32 L20 44 M32 32 L44 44"/>
      <circle cx="20" cy="20" r="6"/>
      <circle cx="44" cy="20" r="6"/>
      <circle cx="20" cy="44" r="6"/>
      <circle cx="44" cy="44" r="6"/>
    </g>
    <circle cx="60" cy="60" r="12.5" fill="#ffffff"/>
    <circle cx="60" cy="60" r="6" fill="#2dd4bf"/>
  </g>

  <text x="240" y="150" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#e6edf6" letter-spacing="-1">Drone Mapping <tspan fill="#38bdf8">Software</tspan></text>
  <text x="240" y="192" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#8496ac" letter-spacing="3">DRONEMAPPINGSOFTWARE.COM</text>

  <text x="96" y="332" font-family="Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff" letter-spacing="-2">The ultimate guide to</text>
  <text x="96" y="420" font-family="Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="url(#grad)">drone mapping software</text>
  <text x="96" y="500" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#b3c0d1">Find the right software with our up-to-date catalog.</text>
</svg>
